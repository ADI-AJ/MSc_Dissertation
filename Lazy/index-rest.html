<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="pageLayout">
            <div id="movieList">
                <div id="loadingIndicator" class="loadingIndicator" style="display:none;">
                Loading more movies...
                </div>
                <div id="scrollSentinel"></div>
            </div>

            <aside class="filterBar">
                <h2>Filters</h2>

                <div id="filtersContainer"></div> <!--Individual filters-->

                <div class="filterTab">
                    <button id="applyFilter">Apply Filters</button>
                    <button id="clearFilter">Clear Filters</button>
                </div>

            </aside>
        </div>

        <script src="fetch-movies-rest-lazy.js"></script>
    </body>
</html>
