<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="pageLayout"> 
            <div id="movieList">
                <div class="movieContainer">
                    <div class="moviePoster"> 
                        <img src="" alt="">        
                    </div>
                    <div class="movieDetails">
                        <h2 class = "movieTitle"></h2> <!-- Title -->
                        <div class = "movieAttributes">
                            <h4 class="releaseDate"></h4> <!-- Release date -->
                            <h4 class="runtime"></h4> <!-- Runtime -->
                            <h4 class="adultRating"></h4> <!-- Adult Rating -->
                            <h4 class="rating"></h4> <!-- Rating -->
                            <h4 class="revenue"></h4> <!-- Revenue -->
                            <h4 class="status"></h4> <!-- Status -->
                        </div>              
                    </div>
                </div>
            </div>
            <aside class="filterBar">
                <h2>Filters</h2>

                <div id="filtersContainer"></div> <!--Individual filters-->

                <div class="filterTab">
                    <button id="applyFilter">Apply Filters</button>
                    <button id="clearFilter">Clear Filters</button>
                </div>

            </aside>
        </div>
            
            
        <script src="fetch-movies-graph.js"></script>
    </body>      
</html>
